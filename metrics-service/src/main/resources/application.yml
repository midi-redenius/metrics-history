spring:
  application:
    name: metrics-service

  datasource:
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Applied when V2 creates the retention policy; later changes need a new migration.
      pointRetention: ${POINT_RETENTION:90 days}

  kafka:
    consumer:
      group-id: metrics-writer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.redenius.metrics.common.dto
        spring.json.value.default.type: com.redenius.metrics.common.dto.MetricPointMessage
    listener:
      concurrency: 3

  cache:
    type: none

  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via-dto

app:
  kafka:
    topic: metrics.raw
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173

logging:
  pattern:
    console: "%d{ISO8601} %5p [%X{correlationId:-}] [%t] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Kafka stays in the aggregate /actuator/health only: the HTTP API keeps working without it.
        readiness:
          include: readinessState,db,redis
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
