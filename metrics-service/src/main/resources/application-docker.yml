spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:metrics}
    username: ${POSTGRES_USER:metrics}
    password: ${POSTGRES_PASSWORD:metrics}

  kafka:
    bootstrap-servers: kafka:9092

  data:
    redis:
      host: redis
      port: 6379

  cache:
    type: redis

logging:
  structured:
    format:
      console: logstash
