name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Coverage summary
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob

          def pct(missed, covered):
              return f"{100 * covered / (missed + covered):.1f}%" if missed + covered else "n/a"

          print("| Module | Lines | Branches |\n|---|---|---|")
          for path in sorted(glob.glob("*/target/site/jacoco/jacoco.csv")):
              rows = list(csv.DictReader(open(path)))
              total = lambda key: sum(int(r[key]) for r in rows)
              print(f"| {path.split('/')[0]} | {pct(total('LINE_MISSED'), total('LINE_COVERED'))} "
                    f"| {pct(total('BRANCH_MISSED'), total('BRANCH_COVERED'))} |")
          EOF
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "*/target/site/jacoco/"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
